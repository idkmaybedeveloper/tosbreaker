name: release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build-num: ${{ steps.info.outputs.build-num }}
      tag: ${{ steps.info.outputs.tag }}
      previous-tag: ${{ steps.info.outputs.previous-tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - id: info
        run: node scripts/version.ts

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      artifact-name: tosbreaker-${{ github.sha }}-staging
      build-num: ${{ needs.version.outputs.build-num }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: changelogs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tosbreaker-${{ github.sha }}-staging
          path: out

      - name: attest plugins
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: out/*.inu.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tosbreaker-${{ needs.version.outputs.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous-tag }}
          BUILD: ${{ needs.version.outputs.build-num }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi

          notes="$RUNNER_TEMP/notes.md"
          changelog="changelogs/$BUILD.md"
          generate=()
          if [ -f "$changelog" ]; then
            cat "$changelog" > "$notes"
          else
            : > "$notes"
            generate=(--generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"})
          fi
          # shellcheck disable=SC2016 # the backticks are literal markdown
          printf '\n\nbuilt against %s\n\nverify: `gh attestation verify <plugin>.inu.js --repo %s`\n' \
            "$(jq -r .sdk out/build-info.json)" "$GITHUB_REPOSITORY" >> "$notes"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes" \
            "${generate[@]}" \
            out/*.inu.js
