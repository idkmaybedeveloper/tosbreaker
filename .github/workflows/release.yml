name: release

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: plugin to release (its key in inu.config.ts)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.plugin }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      artifact-name: tosbreaker-${{ github.sha }}-staging

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tosbreaker-${{ github.sha }}-staging
          path: out

      - name: pick plugin
        id: pick
        env:
          PLUGIN: ${{ inputs.plugin }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          entry=$(jq -c --arg name "$PLUGIN" '.plugins[] | select(.name == $name)' out/build-info.json)
          if [ -z "$entry" ]; then
            echo "::error::no plugin '$PLUGIN', built: $(jq -r '[.plugins[].name] | join(", ")' out/build-info.json)"
            exit 1
          fi
          tag=$(jq -r .tag <<<"$entry")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists, bump $PLUGIN's version in inu.config.ts"
            exit 1
          fi
          {
            echo "file=$(jq -r .file <<<"$entry")"
            echo "version=$(jq -r .version <<<"$entry")"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: attest plugin
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: out/${{ steps.pick.outputs.file }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pick.outputs.tag }}
          path: |
            out/${{ steps.pick.outputs.file }}
            out/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ inputs.plugin }}
          TAG: ${{ steps.pick.outputs.tag }}
          VERSION: ${{ steps.pick.outputs.version }}
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          # shellcheck disable=SC2016 # the backticks are literal markdown
          notes=$(printf 'built against %s@%s\n\nverify: `gh attestation verify %s --repo %s`' \
            "$(jq -r .inugramRepo out/build-info.json)" "$(jq -r .inugramSha out/build-info.json)" \
            "$FILE" "$GITHUB_REPOSITORY")
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq \
            "[.[].tagName | select(startswith(\"$PLUGIN-v\"))][0] // empty")
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PLUGIN $VERSION" \
            --notes "$notes" \
            --generate-notes \
            ${previous:+--notes-start-tag "$previous"} \
            "out/$FILE"
